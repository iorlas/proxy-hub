name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  G3PROXY_IMAGE: ghcr.io/${{ github.repository_owner }}/proxy-hub-g3proxy
  HEALTH_IMAGE: ghcr.io/${{ github.repository_owner }}/proxy-hub-health
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/proxy-hub-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "tag=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push g3proxy
        uses: docker/build-push-action@v6
        with:
          context: ./g3proxy
          push: true
          cache-from: type=gha,scope=g3proxy
          cache-to: type=gha,mode=max,scope=g3proxy
          tags: ${{ env.G3PROXY_IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Build and push health-checker
        uses: docker/build-push-action@v6
        with:
          context: ./health-checker
          push: true
          cache-from: type=gha,scope=health
          cache-to: type=gha,mode=max,scope=health
          tags: ${{ env.HEALTH_IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Build and push proxy-api
        uses: docker/build-push-action@v6
        with:
          context: ./proxy-api
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}

      # The homelab fetches this file by the image tag (homelab docs/runbooks/onboard-app-repo.md).
      - uses: docker/setup-compose-action@v1
      - name: Publish compose.yml under the image tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # publish refuses an unset ${VAR:?}; placeholders satisfy it, and only the
          # file itself is uploaded, never these values.
          grep -oE '\$\{[A-Za-z_][A-Za-z0-9_]*' compose.yml | cut -c3- | sort -u | sed 's/$/=placeholder/' > /tmp/placeholders.env
          docker compose -f compose.yml --env-file /tmp/placeholders.env publish "ghcr.io/iorlas/proxy-hub-compose:$TAG" --yes

  # Copied from homelab docs/runbooks/onboard-app-repo.md. Starts the homelab's
  # deploy.yml, waits for it, and prints its log here only when it fails.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: homelab-deploy
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.HOMELAB_DEPLOY_APP_ID }}
          private-key: ${{ secrets.HOMELAB_DEPLOY_APP_KEY }}
          owner: iorlas
          repositories: homelab
      - name: Deploy on the homelab
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          STACK: proxy-hub
          TAG: ${{ needs.build.outputs.tag }}
          RUN_KEY: ${{ github.repository }}@${{ github.sha }}.${{ github.run_attempt }}
        run: |
          # REST, not `gh workflow run`: that one asks GraphQL for the default branch,
          # which the App (Actions only) may not read.
          gh api -X POST repos/iorlas/homelab/actions/workflows/deploy.yml/dispatches -f ref=main \
            -f "inputs[stack]=$STACK" -f "inputs[tag]=$TAG" -f "inputs[run_key]=$RUN_KEY"
          for _ in $(seq 24); do
            sleep 5
            id=$(gh run list -R iorlas/homelab -w deploy.yml -L 30 --json databaseId,displayTitle \
              -q ".[] | select(.displayTitle | contains(\"$RUN_KEY\")) | .databaseId" | head -1)
            [ -n "$id" ] && break
          done
          [ -n "$id" ] || { echo "::error::no homelab deploy run named $RUN_KEY after 2 minutes"; exit 1; }
          echo "homelab run: https://github.com/iorlas/homelab/actions/runs/$id"
          if gh run watch "$id" -R iorlas/homelab --exit-status --interval 10 >/dev/null; then
            echo "deployed $STACK $TAG"
          else
            gh run view "$id" -R iorlas/homelab --log-failed
            exit 1
          fi
